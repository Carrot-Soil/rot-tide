      </div>
    </div>`;

  sheet.querySelectorAll("[data-mut]").forEach(n => {
    n.onclick = () => {
      const o = mu.options.find(x => x.id === n.dataset.mut);
      if (!o) return;
      const uidEl = document.getElementById("mutUp");

  document.getElementById("mutDone").onclick = () => { Snd.click(); mutationDone(); };
  openOverlay("mutation");
}

// ── 新手指导 ────────────────────────────────────────
// 落地时是一条浮在画面下方的对话框；点「确定」后等比缩小 + 平移到左上角，
// 换成一块小任务框。目标一达成就自动翻课：下方对话框直接弹出下一课的任务，
// 不再需要点「下一课」按钮（按钮只在等不住时用来跳过那段停留）。
let tutUi = { i: -1, wide: true, adv: false };
let tutFlight = 0;          // 动画世代号，换课时作废还没跑完的定时器
let tutAdvTimer = 0;        // 达成后自动翻课的定时器
const TUT_ADV_MS = 1100;    // 达成后停多久再翻课（留出看"已完成"和听提示音的时间）

function tutAdvClear() {
  if (tutAdvTimer) { clearTimeout(tutAdvTimer); tutAdvTimer = 0; }
}

function renderTut() {
  const box = document.getElementById("tutBox");
  if (!box) return;
  const t = S && S.tut;

  if (!t) {
    if (tutUi.i !== -1) {
      tutFlight++; tutAdvClear();
      box.classList.remove("on", "docked", "done");
      box.style.transition = "none";
      box.style.transform = "none";
      box.style.opacity = "1";
      tutUi = { i: -1, wide: true, adv: false };
    }
    return;
  }

  // 换了一课：整块重置回"展开在下方"的形态
  if (tutUi.i !== t.i) {
    const hadLesson = tutUi.i >= 0;                  // 不是第一次进课
    const wasDocked = hadLesson && !tutUi.wide;      // 上一课已经收在左上角
    const gen = ++tutFlight; tutAdvClear();
    tutUi = { i: t.i, wide: true, adv: false };
    box.classList.remove("docked", "done");
    box.classList.add("on");
    box.style.transition = "none";
    box.style.transform = "none";
    box.style.opacity = "1";
    const title = t.name.replace(/^第\s*\d+\s*课\s*·\s*/, "");
    document.getElementById("tbK").textContent = `新手教程 · 第 ${t.i + 1} / ${t.n} 课`;
    document.getElementById("tbN").textContent = title;
    document.getElementById("tbG").textContent = `目标：${t.goal_text}`;
    document.getElementById("tbH").textContent = t.hint;
    document.getElementById("tmK").textContent = `新手任务 · ${t.i + 1}/${t.n}`;
    document.getElementById("tmN").textContent = title;
    document.getElementById("tmG").textContent = t.goal_text;
    document.getElementById("tbOk").onclick = () => tutMinimize();
    document.getElementById("tmSt").onclick = () => tutNext();
    // 从左上角长回下方：上一课是"缩下去"，这一课反着飞，读起来才是一件事的两个方向
    if (wasDocked) tutRise(gen);
    else if (hadLesson) {
      // 玩家没点确定、一直对着宽版就把目标做完了：这里只换文案，淡一下免得像闪屏
      box.style.transition = "none";
      box.style.opacity = "0";
      void box.offsetWidth;
      box.style.transition = "opacity .2s ease-out";
      box.style.opacity = "1";
      setTimeout(() => {
        if (gen !== tutFlight) return;
        box.style.transition = "none";
        box.style.opacity = "1";
      }, 240);
    }
  }

  // 完成态是随时变的，单独同步
  box.classList.toggle("done", !!t.done);

  // 目标一达成就自动往下走，不给"再点一下按钮"这种事
  if (t.done && !tutUi.adv) {
    tutUi.adv = true;
    Snd.win();
    tutAdvClear();
    const course = t.i;
    const tick = () => {
      tutAdvTimer = 0;
      if (!S || !S.tut || S.tut.i !== course || !S.tut.done) return;
      // 局内面板开着（暂停 / 尸茧 / 确认）就先等它关掉，别把玩家的面板顶了
      if (sheetView === "pause" || sheetView === "cocoon" || sheetView === "confirm") {
        tutAdvTimer = setTimeout(tick, 400);
        return;
      }
      // 已经回主菜单 / 进了结算面板，这一课就到此为止，别自己往下翻
      if (sheetView) return;
      tutNext();
    };
    tutAdvTimer = setTimeout(tick, TUT_ADV_MS);
  }

  const st = document.getElementById("tmSt");
  st.className = "tbst" + (t.done ? " done" : "");
  st.textContent = !t.done ? "进行中"
    : t.last ? "✓ 已完成 · 正在收尾…"
    : "✓ 已完成 · 进入下一课…";
  document.getElementById("tbOk").textContent = t.done ? "继续" : "确定";
}

// 下方的宽对话框 → 左上角的小任务框
// 做法：先量好宽版与收起版各自的矩形，再只对 transform 做过渡（平移 + 等比缩放），
// 到站后快速淡出、换成迷你布局、淡入。等比缩放保证文字在飞行途中不被拉变形。
function tutMinimize() {
  const box = document.getElementById("tutBox");
  if (!box || !box.classList.contains("on") || box.classList.contains("docked")) return;
  if (!tutUi.wide) return;
  tutUi.wide = false;
  Snd.click();

  // 上一条 ascent 动画可能还在跑（玩家手快），先把它钉到站再量，否则量到的是半路的尺寸
  if (box.style.transform && box.style.transform !== "none") {
    tutFlight++;
    box.style.transition = "none";
    box.style.transform = "none";
    void box.offsetWidth;
  }

  const a = box.getBoundingClientRect();      // 起飞：宽版

  // 偷量一下到站位置（量完立刻还原，期间不可见所以不会闪）
  box.style.visibility = "hidden";
  box.classList.add("docked");
  const b = box.getBoundingClientRect();
  box.classList.remove("docked");
  box.style.visibility = "";

  const k = b.width / a.width;
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  const dy = (b.top + b.height / 2) - (a.top + a.height / 2);

  const id = ++tutFlight;

  // 起点：原地、原尺寸
  box.style.transition = "none";
  box.style.transformOrigin = "center center";
  box.style.transform = "none";
  box.style.opacity = "1";
  void box.offsetWidth;

  // 飞行
  box.style.transition = "transform .46s cubic-bezier(.22,.9,.26,1)";
  box.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;

  // 到站：换布局。淡出 → 切 docked → 淡入，末了把内联样式钉死，
  // 不依赖过渡自己走完（无头/降帧环境下 transition 可能停在起始值）。
  function land() {
    if (id !== tutFlight) return;
    box.style.transition = "none";
    box.style.transform = "none";
    box.style.opacity = "0";
    box.classList.add("docked");
    void box.offsetWidth;
    box.style.transition = "opacity .16s ease-out";
    box.style.opacity = "1";
    setTimeout(() => {
      if (id !== tutFlight) return;
      box.style.transition = "none";
      box.style.opacity = "1";
    }, 200);
  }

  const onEnd = (ev) => {
    if (ev.target !== box || ev.propertyName !== "transform") return;
    box.removeEventListener("transitionend", onEnd);
    land();
  };
  box.addEventListener("transitionend", onEnd);
  setTimeout(() => { box.removeEventListener("transitionend", onEnd); land(); }, 560);
}

// 上一课收在左上角，下一课要从那儿"长"回画面下方（tutMinimize 的反向）
// 同一个手法：量好收起态与宽版两个矩形，只过渡 transform，等比缩放 + 平移。
function tutRise(gen) {
  const box = document.getElementById("tutBox");
  if (!box) return;
  box.style.visibility = "hidden";
  box.classList.add("docked");
  const a = box.getBoundingClientRect();     // 起飞：左上角小框
  box.classList.remove("docked");
  const b = box.getBoundingClientRect();     // 到站：下方宽框
  box.style.visibility = "";

  const k = a.width / b.width;
  const dx = (a.left + a.width / 2) - (b.left + b.width / 2);
  const dy = (a.top + a.height / 2) - (b.top + b.height / 2);

  box.style.transition = "none";
  box.style.transformOrigin = "center center";
  box.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;
  box.style.opacity = "0";          // 起点先透明：小框的文字字号和宽版不是一套，淡入可以把这层跳变盖掉
  void box.offsetWidth;
  box.style.transition = "transform .44s cubic-bezier(.22,.9,.26,1), opacity .16s ease-out";
  box.style.transform = "none";
  box.style.opacity = "1";
  setTimeout(() => {
    if (gen !== tutFlight) return;
    box.style.transition = "none";
    box.style.transform = "none";
    box.style.opacity = "1";
  }, 500);
}

function tutNext() {
  const t = S && S.tut;
  if (!t || !t.done) return;
  tutFlight++; tutAdvClear();
  Snd.click();
  if (t.last) { showTutFinish(); return; }
  newGame({ tut: t.i + 1 });
}

async function showStart() {
  await loadProfile();
  const sheet = document.getElementById("sheet");
  const M = S.meta.mothers, D = S.meta.diffs, Z = S.meta.ztypes || {};

  const kick = (t) => `<div class="kick">第 ${step + 1} 步 / 共 ${TOTAL} 步 · ${t}</div>`;

  function render() {
    if (step === 0) {
      sheet.innerHTML = `

          <h2>你是一团什么样的菌？</h2>
          <p class="lead">母体不能移动，是这局的核心与败北条件。三种母体技能侧重不同，选一个顺手的。</p>
          <div class="opts">

              <div class="opt${k === mSel ? " on" : ""}" data-m="${k}">
                <b>${v.name}</b>

            <button id="back">← 主菜单</button>
            <button id="tutLink">新手教程</button><span class="grow"></span>
            <button class="pri" id="next"${mSel ? "" : " disabled"}>下一步：难度 →</button>
          </div>
        </div>`;
    } else if (step === 1) {
      sheet.innerHTML = `
        <div class="wiz">${bar()}${kick("选难度")}
          <h2>这次的城市有多难啃？</h2>
          <p class="lead">难度只影响人类数量与质量、每层回合数、开局腐能。母巢的血量和规则都一样。</p>
          <div class="opts">
            ${Object.entries(D).map(([k, v]) => `
              <div class="opt${k === dSel ? " on" : ""}" data-d="${k}">
                <b>${v.label}</b>
                <small>每层 ${v.turns} 回合 · 开局 ${v.ap} 腐能<br>
                  起手 ${v.start_z} 只丧尸 · 场上 ${v.start_h} 名人类</small>
              </div>`).join("")}
          </div>
          <div class="btns">
            <button id="prev">← 上一步</button><span class="grow"></span>
            <button class="pri" id="next"${dSel ? "" : " disabled"}>下一步：确认 →</button>
          </div>
        </div>`;
    } else {
      const own = Object.entries(Z).filter(([, v]) => (v.unlock_lvl || 0) === 0);
      const rest = Object.entries(Z).filter(([, v]) => (v.unlock_lvl || 0) > 0)
        .sort((a, b) => a[1].unlock_lvl - b[1].unlock_lvl);
      sheet.innerHTML = `
        <div class="wiz">${bar()}${kick("确认")}
          <h2>准备下潜</h2>
          <p class="lead">开局只有少数几种丧尸形态，其余靠局内把母巢养起来解锁，不用在局外买。</p>
          <div class="sum">
            <div><small>母体</small><b>${M[mSel].name}</b></div>
            <div><small>难度</small><b>${D[dSel].label}</b></div>
            <div><small>远征</small><b>${(S.meta.maps || []).length} 地图 · ${S.meta.run_layers || 10} 层</b></div>
          </div>
          <div class="chips">
            ${own.map(([, v]) => `<span class="own">${v.name} · 开局可用</span>`).join("")}
            ${rest.map(([, v]) => `<span>${v.name} · 母巢 Lv${v.unlock_lvl}</span>`).join("")}
          </div>
          <p class="lead" style="margin-bottom:10px">

          <div class="grp"><label>种子（留空则随机）</label>
            <input class="seedin" id="seedIn" placeholder="例如 20261124" inputmode="numeric" value="${seedVal}">
          </div>
          <div class="btns">
            <button id="prev">← 上一步</button><span class="grow"></span>

          </div>
        </div>`;
    }
    bind();
  }

  function bind() {
    sheet.querySelectorAll("[data-m]").forEach(n => n.onclick = () => {
      mSel = n.dataset.m; Snd.click();
      sheet.querySelectorAll("[data-m]").forEach(o => o.classList.toggle("on", o === n));
      const b = document.getElementById("next"); if (b) b.disabled = false;
    });
    sheet.querySelectorAll("[data-d]").forEach(n => n.onclick = () => {
      dSel = n.dataset.d; Snd.click();
      sheet.querySelectorAll("[data-d]").forEach(o => o.classList.toggle("on", o === n));
      const b = document.getElementById("next"); if (b) b.disabled = false;
    });
    const bk = document.getElementById("back");
    if (bk) bk.onclick = () => { Snd.click(); showMenu(); };
    const tl = document.getElementById("tutLink");
    if (tl) tl.onclick = () => { Snd.click(); showTutorialIntro(); };
    const pv = document.getElementById("prev");
    if (pv) pv.onclick = () => { Snd.click(); step -= 1; render(); };
    const nx = document.getElementById("next");
    if (nx) nx.onclick = () => { Snd.click(); step += 1; render(); };
    const sd = document.getElementById("seedIn");
    if (sd) sd.oninput = () => { seedVal = sd.value; };
    const go = document.getElementById("go");
    if (go) go.onclick = () => newGame({ mother: mSel, diff: dSel, seed: seedVal.trim() });
  }

  render();
  openOverlay("start");
}

      </div>
      <div class="tag" style="margin-top:12px">
        下一局开局时会显示完整的丧尸解锁表：谁的形态在母巢几级解锁，一目了然。</div>
    </div>`;
  document.getElementById("again").onclick = () => showStart();
  document.getElementById("toMenu").onclick = () => showMenu();
  openOverlay("result");
}

// ── 键盘操控 ────────────────────────────────────────
const DIRS = {
  KeyW: [0, -1], KeyA: [-1, 0], KeyS: [0, 1], KeyD: [1, 0],
  ArrowUp: [0, -1], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowRight: [1, 0]
};

document.addEventListener("keydown", e => {
  if (e.code === "KeyM") {
    Snd.muted = !Snd.muted;
    document.getElementById("btnMute").textContent = Snd.muted ? "🔇" : "♪";
    if (!Snd.muted) Snd.click();
    return;
  }
  if (overlayOpen()) {
    if (e.code === "Escape") {
      // 二级页回到上级；尸茧面板视为"稍后再说"；结算/层间面板不响应 Esc
      if (sheetView === "settings") (settingsFrom === "pause" ? showPause() : showMenu());
      else if (sheetView === "credits" || sheetView === "start" || sheetView === "tut") showMenu();
      else if (sheetView === "cocoon") cocoonLater();
      else if (sheetView === "mutation") mutationDone();
      else if (sheetView === "pause") closeOverlay();
      else if (sheetView === "confirm") showPause();
    }
    return;
  }
  if (!S || S.over) return;
  const code = e.code;

  if (code === "Space") { e.preventDefault(); Snd.turn(); act({ type: "end_turn" }); return; }
  if (code === "Escape") {
    e.preventDefault();
    if (mode === "pick_scan") { mode = "idle"; paint(); defaultHint(); return; }
    showPause(); return;
  }
  if (code === "KeyQ") { e.preventDefault(); act({ type: "mother" }); return; }
  if (code === "KeyF") {
    e.preventDefault();
    const u = sel ? byId(sel) : null;
    if (u) onSkill(u); else { Snd.err(); flash("先选中一个丧尸"); }
    return;
  }
  if (code === "Tab") {
    e.preventDefault();
    const mine = S.units.filter(u => u.side === "z")
      .sort((a, b) => (a.mother ? 1 : 0) - (b.mother ? 1 : 0) || a.uid - b.uid);
    if (!mine.length) return;
    const i = mine.findIndex(u => u.uid === sel);
    sel = mine[(i + 1) % mine.length].uid;
    Snd.click(); paint(); defaultHint(); return;
  }
  const dm = /^Digit([1-9])$/.exec(code);
  if (dm) {
    const mine = S.units.filter(u => u.side === "z")
      .sort((a, b) => (a.mother ? 1 : 0) - (b.mother ? 1 : 0) || a.uid - b.uid);
    const u = mine[+dm[1] - 1];
    if (u) { sel = u.uid; Snd.click(); paint(); defaultHint(); }
    return;
  }
  if (DIRS[code]) {
    e.preventDefault();
    const u = sel ? byId(sel) : null;
    if (!u || u.mother || !u.reach) { Snd.err(); flash("先按 Tab 或数字键选一个丧尸"); return; }
    const [dx, dy] = DIRS[code];
    const tx = u.x + dx, ty = u.y + dy;
    if (u.reach.some(c => c[0] === tx && c[1] === ty)) {
      act({ type: "move", uid: u.uid, x: tx, y: ty });
    } else {
      Snd.err();
    }
    return;
  }
});

// ── 启动 ────────────────────────────────────────────
document.getElementById("btnEnd").onclick = () => act({ type: "end_turn" });
document.getElementById("btnMenu").onclick = () => { Snd.click(); showPause(); };
// 手机端：底栏 / 抽屉
document.getElementById("mscrim").onclick = () => closeSheets();
document.querySelectorAll("#mbar [data-sheet]").forEach(n => {
  n.onclick = () => openSheet(n.dataset.sheet);
});
document.getElementById("mEnd").onclick = () => act({ type: "end_turn" });
document.getElementById("mMenu").onclick = () => { Snd.click(); closeSheets(); showPause(); };
document.getElementById("mSkill").onclick = () => {
  const u = sel ? byId(sel) : null;
  if (!u) { Snd.err(); flash("先点一只丧尸"); return; }
  onSkill(u);
};
document.getElementById("btnMute").onclick = () => {
  Snd.init(); Snd.muted = !Snd.muted;
  document.getElementById("btnMute").textContent = Snd.muted ? "🔇" : "♪";
};
window.addEventListener("resize", () => {
  if (!S) return;
  if (!window.matchMedia("(max-width:900px)").matches) closeSheets();
  resize(); clampCam(); draw(); updateZoomLabel();
});

// 横竖屏切换：重新适配一次，别让镜头停在屏幕外
window.addEventListener("orientationchange", () => {
  if (!S) return;
  setTimeout(() => {
    resize();
    if (isMobile()) fitView(); else clampCam();
    draw();
  }, 300);
});

(async function boot() {
  const q = new URLSearchParams(location.search);
  S = ROT.state();          // 规则在浏览器里跑，不再请求服务器
  await loadProfile();
  if (q.get("seed") || q.get("mother") || q.get("diff")) {
    await newGame({
      mother: q.get("mother") || "brood",
      diff: q.get("diff") || "normal",
      seed: q.get("seed") || ""
    });
  } else {
    resize(); fitView(); paint();
    await showMenu();
  }
})();
</script>
</body>
